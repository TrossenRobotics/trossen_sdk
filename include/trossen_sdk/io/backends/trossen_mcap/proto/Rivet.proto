syntax = "proto3";
package trossen_sdk.msg;

import "Timestamp.proto";

// Bimanual joint state (left/right arm) plus mobile base velocities, as
// produced by the Rivet composite (two arms + base).
message Rivet {
  // Dual (monotonic + realtime) timestamp of the record
  trossen_sdk.Timestamp ts = 1;

  // Sequence number of the record
  uint64 seq = 2;

  // Left arm joint positions (rad or m, gripper included)
  repeated float left_positions = 3;

  // Left arm joint velocities (rad/s or m/s, gripper included)
  repeated float left_velocities = 4;

  // Left arm joint efforts (Nm or N, gripper included)
  repeated float left_efforts = 5;

  // Right arm joint positions (rad or m, gripper included)
  repeated float right_positions = 6;

  // Right arm joint velocities (rad/s or m/s, gripper included)
  repeated float right_velocities = 7;

  // Right arm joint efforts (Nm or N, gripper included)
  repeated float right_efforts = 8;

  // Base linear velocity along x (m/s)
  float linear_x_velocity = 9;

  // Base linear velocity along y (m/s)
  float linear_y_velocity = 10;

  // Base angular velocity around z (rad/s)
  float angualar_z_velocity = 11;

  // Lift actuator velocity
  float lift_velocity = 12;
}
