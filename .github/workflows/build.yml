name: Build and Test

on:
  push:
    branches: [ main ]
  # Any base branch.
  pull_request:
  # Mondays 10:37 UTC.
  schedule:
    - cron: '37 10 * * 1'
  workflow_dispatch:

# Supersede in-progress runs for the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits the build configurations from .github/ci-configs.json: those marked "pr" for
  # pull requests, all of them for every other event.
  select-configs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select build configurations
      id: select
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          include=$(jq -c '[.[] | select(.pr)]' .github/ci-configs.json)
        else
          include=$(jq -c '.' .github/ci-configs.json)
        fi
        echo "Selected configs: $(echo "$include" | jq -r 'map(.name) | join(", ")')"
        echo "include=$include" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: select-configs
    permissions:
      contents: read
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-configs.outputs.include) }}

    name: build-and-test (${{ matrix.name }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libopencv-dev \
          libprotobuf-dev \
          protobuf-compiler \
          pkg-config \
          libbz2-dev \
          zlib1g-dev \
          libgrpc++-dev \
          protobuf-compiler-grpc \
          python3-dev

    - name: Install Parquet dependencies
      run: |
        wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb && \
        sudo apt-get update && \
        sudo apt-get install -yqq --no-install-recommends \
          ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb && \
        sudo apt-get update && \
        sudo apt-get install -yqq --no-install-recommends \
          libarrow-dev \
          libparquet-dev && \
        rm apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb

    - name: Install libtrossen_arm
      run: |
        # Clone and install libtrossen_arm dependency
        git clone https://github.com/TrossenRobotics/libtrossen_arm.git /tmp/libtrossen_arm
        cd /tmp/libtrossen_arm
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Install RealSense
      run: |
        sudo mkdir -p /etc/apt/keyrings

        # Register the RealSense signing key (official method)
        curl -sSf https://librealsense.realsenseai.com/Debian/librealsenseai.asc | \
          gpg --dearmor | sudo tee /etc/apt/keyrings/librealsenseai.gpg > /dev/null
        sudo chmod 0644 /etc/apt/keyrings/librealsenseai.gpg

        # Make sure apt HTTPS support is installed
        sudo apt-get install -y apt-transport-https

        # Add the server to the list of repositories
        echo "deb [signed-by=/etc/apt/keyrings/librealsenseai.gpg] https://librealsense.realsenseai.com/Debian/apt-repo $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/librealsense.list

        sudo apt-get update

        # Install RealSense packages (latest versions)
        sudo apt-get install -y \
          libfastcdr-dev \
          libfastrtps-dev \
          librealsense2-dev

    - name: Configure
      run: cmake -B build ${{ matrix.flags }}

    - name: Build SDK
      run: cmake --build build -j$(nproc)

    - name: Run Tests
      if: ${{ !matrix.skip_tests }}
      run: ctest --test-dir build --output-on-failure
