[project]
name = "trossen-sdk-webapp-backend"
version = "0.1.0"
description = "Backend for Trossen SDK Webapp"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "mcap>=1.2",
    # Rerun Python SDK: the recorder child logs live records (images, joint
    # state, odometry) into an in-process gRPC server (rr.serve_grpc) that the
    # browser-embedded Rerun web viewer connects to. Pinned to 0.32.0 because
    # the @rerun-io/web-viewer-react frontend package must match the
    # data-source SDK version exactly (web viewer 0.32.x <-> SDK 0.32.x).
    "rerun-sdk==0.32.0",
    "sqlmodel>=0.0.22",
    "trossen-sdk",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
trossen-sdk = { path = "../..", editable = true }

# Dev tooling for the backend (TDS-109). Installed by `uv sync` (the `dev`
# group is included by default). Run with `uv run ruff check .` and
# `uv run pytest`.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I). Conservative on purpose so the
# linter stays signal, not noise; expand as the team wants.
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the backend root on sys.path so tests can `import app.*` without an
# editable install of the backend itself.
pythonpath = ["."]
