# ZED camera overlay for the webapp backend.
#
# StereoLabs ZED cameras need (1) the SDK compiled into the image on a CUDA
# base, and (2) the host GPU exposed to the container at runtime. Both are
# opt-in so the default `docker compose up` stays lean and runnable on machines
# without an NVIDIA GPU / the nvidia container runtime.
#
# Prerequisite (host, one-time, needs sudo): install nvidia-container-toolkit
# and point Docker's runtime at it, e.g.
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
# Verify with:
#   docker run --rm --gpus all nvidia/cuda:12.6.3-base-ubuntu24.04 nvidia-smi
#
# Usage (from webapp/):
#   docker compose -f docker-compose.yml -f docker-compose.zed.yml up --build
#
# The first build pulls the CUDA devel base (~3.5 GB) and the ZED SDK
# (~2.5 GB), so expect a long initial build.

services:
  backend:
    build:
      args:
        ENABLE_ZED: "1"
    # Expose the host NVIDIA GPU(s) to the container. Requires
    # nvidia-container-toolkit on the host (see header). The ZED SDK needs CUDA
    # at runtime to open the camera and run depth.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
