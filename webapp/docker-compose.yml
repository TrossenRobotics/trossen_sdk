# Dev compose for the Trossen SDK webapp.
#
# Both services run on the host network so the backend can talk to arms /
# cameras / mobile bases on 192.168.1.x and the frontend's Vite proxy
# (target http://localhost:8000 in vite.config.ts) reaches the backend
# without any extra plumbing.
#
# Usage (from the repo root or webapp/):
#   cd webapp
#   docker compose up --build
#
# Then open http://localhost:5173 in a browser.
#
# To join a fleet hub, copy .env.example to .env and set HUB_URL + HUB_TOKEN
# (see that file). With no .env the machine runs standalone.

services:
  backend:
    build:
      context: ..                      # repo root, so the SDK source is in build context
      dockerfile: webapp/backend/Dockerfile
      args:
        # ZED is off by default (lean ubuntu base). Opt in either by exporting
        # ENABLE_ZED=1 or by layering docker-compose.zed.yml, which also
        # reserves the GPU at runtime. See that file for the full ZED workflow.
        ENABLE_ZED: ${ENABLE_ZED:-0}
    image: trossen-sdk-webapp-backend:dev
    container_name: trossen_webapp_backend
    network_mode: host                 # host Ethernet (arm subnet) + localhost wiring
    # Host networking also exposes the recorder child's in-process Rerun gRPC
    # server (app/recorder_runner.py, default port 9876) directly on the host,
    # so the browser-embedded Rerun web viewer reaches it at
    # rerun+http://localhost:9876/proxy with no port publishing. (A `ports:`
    # mapping would be ignored under network_mode: host anyway.)
    # Privileged gives the container unrestricted device access: cameras
    # (/dev/video*, /dev/bus/usb/*) and the Slate base's serial port
    # (/dev/ttyUSB* / /dev/ttyACM*) all work without per-major cgroup rules.
    #
    # TODO: replace `privileged: true` with narrow device_cgroup_rules once
    # the Slate's exact device node is confirmed. Expected shape:
    #   device_cgroup_rules:
    #     - 'c 81:* rmw'    # V4L2 video devices (/dev/video*)
    #     - 'c 189:* rmw'   # USB raw devices (/dev/bus/usb/*)
    #     - 'c 188:* rmw'   # USB-serial adapters (/dev/ttyUSB*) — SLATE base
    #     - 'c 166:* rmw'   # CDC-ACM serial (/dev/ttyACM*) — SLATE base, alt enumeration
    privileged: true
    volumes:
      - /dev:/dev
      # Source bind-mount for hot reload. The whole repo is mounted so the
      # editable trossen_sdk install can see the C++ sources too.
      - ..:/app
      # Named volume keeps the .venv (and the compiled pybind extension)
      # out of the host source tree.
      - backend_venv:/app/webapp/backend/.venv
      # Persistent CMake build dir for the SDK's C++ scripts (currently the
      # MCAP→LeRobotV2 converter). Lives outside /app on purpose so the host
      # toolchain's cache is never reused by the container, and is volume-
      # backed so the first-launch build cost doesn't repeat on every restart.
      - backend_cpp_build:/var/cache/trossen_sdk/build
      # Host-writable data dirs. Datasets, configs, and the SQLite DB land
      # under the operator's home directory and survive container teardown.
      - ${HOME}/.trossen_sdk:/root/.trossen_sdk                          # MCAP recordings
      - ${HOME}/.cache/huggingface/lerobot:/root/.cache/huggingface/lerobot  # LeRobot conversions
      - ${HOME}/.config/trossen_sdk_webapp:/root/.config/trossen_sdk_webapp  # system + dataset settings
      - ${HOME}/.local/state/trossen_sdk_webapp:/root/.local/state/trossen_sdk_webapp  # SQLite DB + sessions
    group_add:
      - video        # /dev/video* for OpenCV / V4L2 cameras
      - plugdev      # USB hot-plug
    environment:
      # uvicorn --reload is ON by default so the in-app "Update" button's
      # git pull takes effect without a manual restart (it watches only
      # /app/webapp/backend/app, so the inotify overhead is small). Set
      # UVICORN_RELOAD= (empty) in the host shell or a .env file to turn it
      # off — e.g. if the file-watcher ever competes with the arm UDP loop.
      UVICORN_RELOAD: ${UVICORN_RELOAD:-1}
      # Fleet hub (webapp/hub): to have this machine join a central admin
      # console, point it at the hub and share its token. Unset = standalone
      # (default; the machine never phones home). MACHINE_NAME is an optional
      # friendly label on the dashboard (defaults to the hostname).
      #   HUB_URL: ws://<hub-host-ip>:8100
      #   HUB_TOKEN: <same token as the hub's HUB_TOKEN>
      #   MACHINE_NAME: Cell-A
      HUB_URL: ${HUB_URL:-}
      HUB_TOKEN: ${HUB_TOKEN:-}
      MACHINE_NAME: ${MACHINE_NAME:-}
    # Report "healthy" only once uvicorn is actually serving on :8000, so the
    # frontend can wait for a ready backend instead of spraying ECONNREFUSED
    # proxy errors while `uv sync` + the SDK build are still running. curl is in
    # the image and /api/version is a cheap always-on GET; localhost:8000 is the
    # backend itself under host networking. start_period is generous because the
    # first-launch dependency download + pybind build is slow on a Pi (it costs
    # nothing on a fast box — a passing check flips to healthy immediately).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: trossen-sdk-webapp-frontend:dev
    container_name: trossen_webapp_frontend
    network_mode: host                 # so Vite's /api proxy hits localhost:8000
    volumes:
      - ./frontend:/app/webapp/frontend
      - frontend_node_modules:/app/webapp/frontend/node_modules
    depends_on:
      backend:
        # Wait for the backend to be serving, not merely created — this is what
        # stops Vite from proxying to a not-yet-listening :8000 on startup.
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_venv:
  backend_cpp_build:
  frontend_node_modules:
